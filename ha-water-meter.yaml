esphome:
  name: ha-water-meter
  friendly_name: HA-Water-Meter

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "xxxxxxxxxxxxxxxxxxxxxxxxxxx"

ota:
  platform: esphome
  password: "xxxxxxxxxxxxxxxxxxxxxxxxxxx"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
 #use_address: 10.10.40.102
 # manual_ip:
    # Set this to the IP of the ESP
    #static_ip: 10.10.40.50
    # Set this to the IP address of the router. Often ends with .1
    #gateway: 10.10.40.1
    # The subnet of the network. 255.255.255.0 works for most home networks.
    #subnet: 255.255.255.0
    # DNS Server
    #dns1: 1.1.1.1
    #dns2: 8.8.8.8

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ha-Water-Meter Fallback Hotspot"
    password: "xxx"

captive_portal:

binary_sensor:
  - platform: status
    name: '${friendly_name} - Device Online'
    id: device_online
    device_class: connectivity

substitutions:
  friendly_name: Flow
  device_description: "Measure your water consumption with a dumb water meter"
  pulse_pin: GPIO12

# Some basic sensors for HA implementation
text_sensor:
  - platform: version
    hide_timestamp: true
    name: '${friendly_name} - ESPHome Version'
  - platform: wifi_info
    ip_address:
      name: '${friendly_name} - IP Address'
      icon: mdi:wifi
    ssid:
      name: '${friendly_name} - Connected SSID'
      icon: mdi:wifi-strength-2

#WiFi signal sensor for troubleshooting and positioning
sensor:
  # WiFi signal
  - platform: wifi_signal
    name: "${friendly_name} - WiFi Signal"
    update_interval: 120s

  # Pulse meter
  - platform: pulse_meter
    name: '${friendly_name} - Flow Rate'
    id: sensor_water_pulse_meter
    device_class: volume_flow_rate
    state_class: measurement
    unit_of_measurement: 'L/min'
    icon: mdi:water-outline
    accuracy_decimals: 0
    timeout: 10s
    internal_filter: 50ms
    pin: ${pulse_pin}

    total:
      name: '${friendly_name} - Total Water Consumption'
      id: sensor_total_water
      device_class: water
      state_class: total_increasing
      unit_of_measurement: 'm³'
      icon: mdi:water-outline
      accuracy_decimals: 3
      filters:
        - multiply: 0.001
