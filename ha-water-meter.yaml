substitutions:
  friendly_name: Flow
  device_description: "Measure your water consumption with a dumb water meter"
  pulse_pin: GPIO12
  # Volume represented by one meter pulse. Must be greater than zero.
  liters_per_pulse: "1.0"

esphome:
  name: ha-water-meter
  friendly_name: HA-Water-Meter
  comment: ${device_description}
  on_boot:
    # Runs after globals (800) and pulse_meter (600) are set up, so the
    # persisted total survives reboots and power outages.
    priority: 250
    then:
      - pulse_meter.set_total_pulses:
          id: sensor_water_pulse_meter
          value: !lambda 'return id(g_total_pulses);'

esp8266:
  board: nodemcuv2
  # Persist preferences (e.g. the water total) to flash so they survive
  # power loss, not just soft reboots.
  restore_from_flash: true

preferences:
  # Limit flash writes to reduce wear; at most one write every 5 minutes.
  flash_write_interval: 5min

globals:
  # Total pulse count, mirrored from the pulse meter and persisted to flash.
  - id: g_total_pulses
    type: uint32_t
    restore_value: yes
    initial_value: '0'

# Enable logging
logger:

# Needed for the reset reason text sensor
debug:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # use_address: 10.10.40.102
  # manual_ip:
  #   # Set this to the IP of the ESP
  #   static_ip: 10.10.40.50
  #   # Set this to the IP address of the router. Often ends with .1
  #   gateway: 10.10.40.1
  #   # The subnet of the network. 255.255.255.0 works for most home networks.
  #   subnet: 255.255.255.0
  #   # DNS Server
  #   dns1: 1.1.1.1
  #   dns2: 8.8.8.8

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Ha-Water-Meter Fallback Hotspot"
    password: !secret ap_password

captive_portal:

binary_sensor:
  - platform: status
    name: '${friendly_name} - Device Online'
    id: device_online
    device_class: connectivity
    entity_category: diagnostic

# Some basic sensors for HA implementation
text_sensor:
  - platform: version
    hide_timestamp: true
    name: '${friendly_name} - ESPHome Version'
    entity_category: diagnostic
  - platform: debug
    reset_reason:
      name: '${friendly_name} - Reset Reason'
      icon: mdi:restart-alert
      entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: '${friendly_name} - IP Address'
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: '${friendly_name} - Connected SSID'
      icon: mdi:wifi-strength-2
      entity_category: diagnostic

sensor:
  # Device uptime for diagnostics and availability heartbeat in Home Assistant
  - platform: uptime
    name: '${friendly_name} - Uptime'
    id: sensor_uptime
    update_interval: 60s
    entity_category: diagnostic

  # WiFi signal sensor for troubleshooting and positioning
  - platform: wifi_signal
    name: '${friendly_name} - WiFi Signal'
    update_interval: 120s
    entity_category: diagnostic

  # Pulse meter (1 pulse = 1 liter; adjust the multiply filter below if
  # your meter uses a different pulse constant)
  - platform: pulse_meter
    name: '${friendly_name} - Flow Rate'
    id: sensor_water_pulse_meter
    device_class: volume_flow_rate
    state_class: measurement
    unit_of_measurement: 'L/min'
    icon: mdi:water-outline
    accuracy_decimals: 0
    filters:
      - multiply: ${liters_per_pulse}
    timeout: 10s
    internal_filter: 50ms
    pin:
      number: ${pulse_pin}
      # If the reed switch pulls the pin to GND and there is no external
      # pull-up resistor, enable the internal one:
      # mode: INPUT_PULLUP

    total:
      name: '${friendly_name} - Total Water Consumption'
      id: sensor_total_water
      device_class: water
      state_class: total_increasing
      unit_of_measurement: 'm³'
      icon: mdi:water-outline
      accuracy_decimals: 3
      filters:
        - multiply: ${liters_per_pulse}
        - multiply: 0.001
      on_raw_value:
        # Mirror the pulse count into the persisted global
        then:
          - globals.set:
              id: g_total_pulses
              value: !lambda 'return static_cast<uint32_t>(x);'

number:
  # Set the total to match the physical meter reading (in m³), e.g. after
  # first flashing or after the meter was replaced.
  - platform: template
    name: '${friendly_name} - Set Meter Reading'
    id: number_set_meter_reading
    entity_category: config
    icon: mdi:counter
    unit_of_measurement: 'm³'
    mode: box
    min_value: 0
    max_value: 100000
    step: 0.001
    update_interval: 30s
    lambda: |-
      if (isnan(id(sensor_total_water).state)) {
        return {};
      }
      return id(sensor_total_water).state;
    set_action:
      then:
        - pulse_meter.set_total_pulses:
            id: sensor_water_pulse_meter
            value: !lambda 'return static_cast<uint32_t>(roundf(x * 1000.0f / ${liters_per_pulse}));'

button:
  - platform: restart
    name: '${friendly_name} - Restart Device'
    id: button_restart_device
    entity_category: config
