name: Validate & Release

on:
  push:
    branches:
      - main
      - 'nightly/**'
    paths:
      - 'ha-water-meter.yaml'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'ha-water-meter.yaml'

jobs:
  validate:
    name: Validate ESPHome config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ESPHome
        run: pip install "esphome==2026.10.0"

      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<'EOF'
          wifi_ssid: "ci-dummy-ssid"
          wifi_password: "ci-dummy-password"
          api_encryption_key: "AQIDBAUGBwgJCgsMDQ4PEBESExQVFhcYGRobHB0eHyA="
          ota_password: "ci-dummy-ota-password"
          ap_password: "ci-dummy-ap-pass"
          EOF

      - name: Validate and compile firmware
        run: |
          esphome config ha-water-meter.yaml
          esphome compile ha-water-meter.yaml

  release:
    name: Create Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: calc_version
        run: |
          # Hole das neueste Tag, falls vorhanden
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Latest tag: $LATEST_TAG"

          # Entferne das 'v' Präfix und teile in Major/Minor/Patch
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}

          NEW_VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "New version: $NEW_VERSION"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.calc_version.outputs.new_version }}
          name: Release ${{ steps.calc_version.outputs.new_version }}
          generate_release_notes: true
          files: ha-water-meter.yaml
